daemon off; #to run in current terminal(available Ctrl + C for studying purpose)
#error_log /dev/stderr info; 
#error_log /logs/nginx-error.log; #NGINX는 기본적으로 시스템 폴더인 var/log/nginx에 기록하지만, idx에선 보안상 이유로 해당 폴더에 접근하거나, 파일 생성할 권한이 없음

events {
    worker_connections 2048; #number of network connections per process. 
}

http {
    #access_log /logs/nginx-access.log; # for studying purpose. to print log in terminal
    upstream my-load-balanced-app {
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
        server 127.0.0.1:8083;
        server 127.0.0.1:8084;
    }

    server {
        listen 8080; 
        location / {
            proxy_pass http://my-load-balanced-app; 
        }
    }
}
